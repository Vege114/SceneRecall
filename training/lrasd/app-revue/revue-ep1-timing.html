      function showSelection() {
        for (const button of controls.querySelectorAll('.phase-button')) button.setAttribute('aria-pressed', String(Number(button.dataset.phase) === selection.phase));
        D.select(svg).selectAll('[data-receipt-mark]').attr('opacity', function () {
          return selection.phase === 4 || Number(this.dataset.phase) === selection.phase ? 0.82 : 0.62;
        });
        D.select(svg).selectAll('[data-selected-mark]').remove();
        if (selection.phase === 4) {
          const event = selection.event === null ? null : data.events[selection.event];
          detail.textContent = event ? `${formatClock(event.t)} · ${event.label} · ${event.note}`
            : '失败／恢复：◇记录失败或发现时刻；○成功收据或验证时刻。未记录完整状态迁移，不推算修复耗时。';
          if (event && layout) D.select(svg).append('circle').attr('data-selected-mark', '').attr('cx', layout.x(event.t)).attr('cy', 337)
            .attr('r', 7).attr('fill', 'var(--foreground)').attr('opacity', 0.28);
          return;
        }
        const phase = data.phases[selection.phase];
        const row = rows[selection.phase].find(item => item[5] === selection.receipt);
        detail.textContent = row ? receiptDetail(row, selection.phase)
          : `${phase.name} · ${phase.progress} · ${phase.requests}次请求 · 累计${duration(phase.elapsed)}（非墙钟） · ${rows[selection.phase].length}张成功收据${phase.aggregates ? '；' + phase.aggregates + '张零调用合并不画条' : ''}。`;
        if (row && layout) {
          const y = 94 + selection.phase * 56;
          D.select(svg).append('rect').attr('data-selected-mark', '').attr('x', layout.x(row[1])).attr('y', y - 2)
            .attr('width', Math.min(layout.right - layout.x(row[1]), Math.max(3, layout.x(row[2]) - layout.x(row[1])))).attr('height', 24)
            .attr('fill', phaseColors[selection.phase]);
        }
      }
      function choose(phase, receipt = null, event = null) {
        selection = { phase, receipt, event };
        tooltip.hidden = true;
        showSelection();
        persist();
      }
      function nearest(phase, seconds) {
        const values = rows[phase];
        const within = values.filter(row => row[1] <= seconds && row[2] >= seconds);
        const candidates = within.length ? within : values;
        return candidates.reduce((best, row) => !best || Math.abs((row[1] + row[2]) / 2 - seconds) < Math.abs((best[1] + best[2]) / 2 - seconds) ? row : best, null);
      }
      function eventAt(seconds) {
        return data.events.reduce((best, event, index) => best === null || Math.abs(event.t - seconds) < Math.abs(data.events[best].t - seconds) ? index : best, null);
      }
      function pointTime(event) {
        const bounds = plot.getBoundingClientRect();
        return layout.x.invert(Math.max(layout.left, Math.min(layout.right, event.clientX - bounds.left)));
      }
      function draw() {
        const width = Math.max(320, plot.getBoundingClientRect().width || root.getBoundingClientRect().width || 736);
        const left = 76, right = width - 12, height = 392;
        const x = D.scaleLinear().domain([0, data.end]).range([left, right]);
        layout = { x, left, right, width };
        const chart = D.select(svg).attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
        chart.selectAll('*').remove();
        chart.append('desc').text('583次模型请求，四阶段已完成；成功收据区间由落盘时间减记录耗时推定，存在未知发布延迟。累计请求耗时含已记录失败且可并发，不等于墙钟。墙钟包络包含未定位的排队、暂停、修复与本地工作。');
        chart.append('rect').attr('data-chart-frame', '').attr('x', left).attr('y', 28).attr('width', right - left).attr('height', 326)
          .attr('fill', 'none').attr('stroke', 'var(--border)').attr('stroke-width', 1);
        const tickCount = width < 440 ? 3 : width < 640 ? 4 : 6;
        const ticks = D.range(tickCount).map(index => data.end * index / (tickCount - 1));
        for (const [index, tick] of ticks.entries()) {
          chart.append('line').attr('x1', x(tick)).attr('x2', x(tick)).attr('y1', 28).attr('y2', 354)
            .attr('stroke', 'var(--border)').attr('opacity', 0.5).attr('stroke-width', 1);
          chart.append('text').attr('x', x(tick)).attr('y', 373).attr('text-anchor', index === 0 ? 'start' : index === ticks.length - 1 ? 'end' : 'middle')
            .text(shortClock.format(new Date(data.start + tick * 1000)));
        }
        chart.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('x', right).attr('y', 391).attr('text-anchor', 'end').text('北京时间 · 时:分');
        chart.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('x', 0).attr('y', 18).text('阶段');
        chart.append('text').attr('x', 0).attr('y', 48).text('包络');
        chart.append('rect').attr('x', left).attr('y', 34).attr('width', right - left).attr('height', 18).attr('fill', 'var(--muted)');
        chart.append('text').attr('x', left + 4).attr('y', 47).text(`9小时10分51秒 · 已完成${width >= 480 ? ' · 88场景 · 583次请求' : ''}`);
        controls.replaceChildren();
        data.phases.forEach((phase, index) => {
          const y = 94 + index * 56;
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'phase-button text-small cursor-interaction';
          button.style.top = `${y - 8}px`; button.dataset.phase = String(index); button.textContent = phase.name;
          button.addEventListener('click', () => choose(index)); controls.append(button);
          const slots = [];
          const placements = rows[index].map(row => {
            let slot = slots.findIndex(end => end <= row[1]);
            if (slot < 0) slot = slots.length;
            slots[slot] = row[2];
            return { row, slot };
          });
          const spacing = 20 / Math.max(1, slots.length);
          for (const { row, slot } of placements) chart.append('rect').attr('data-receipt-mark', row[5]).attr('data-phase', index)
            .attr('x', x(row[1])).attr('y', y + slot * spacing).attr('width', Math.min(right - x(row[1]), Math.max(0.8, x(row[2]) - x(row[1]))))
            .attr('height', Math.min(16, Math.max(1, spacing - 0.4))).attr('fill', phaseColors[index]);
          chart.append('text').attr('x', left).attr('y', y + 38).text(`${phase.requests}次 · 累计${duration(phase.elapsed)}`);
          if (width >= 600) chart.append('text').attr('x', right - 4).attr('y', y + 38).attr('text-anchor', 'end').text(phase.progress);
          const hit = document.createElement('button');
          hit.type = 'button'; hit.className = 'lane-hit cursor-interaction'; hit.dataset.lane = String(index);
          hit.style.left = `${left}px`; hit.style.top = `${y - 8}px`; hit.style.width = `${right - left}px`;
          hit.setAttribute('aria-label', `${phase.name}成功收据；点击时间区间，或用左右方向键切换收据`);
          hit.addEventListener('click', event => { const row = event.detail ? nearest(index, pointTime(event)) : rows[index].find(row => row[5] === selection.receipt) || rows[index][0]; if (row) choose(index, row[5]); });
          hit.addEventListener('keydown', event => {
            if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
            event.preventDefault();
            const current = rows[index].findIndex(row => row[5] === selection.receipt);
            const next = Math.max(0, Math.min(rows[index].length - 1, current + (event.key === 'ArrowRight' ? 1 : -1)));
            choose(index, rows[index][next][5]);
          });
          hit.addEventListener('pointermove', event => {
            const row = nearest(index, pointTime(event));
            if (!row) return;
            tooltip.textContent = `${phase.name} · ${formatClock(row[1])}–${formatClock(row[2])}（推定） · ${(row[3] / 1000).toFixed(1)}秒`;
            tooltip.style.left = `${Math.max(left, Math.min(width - 220, event.clientX - plot.getBoundingClientRect().left))}px`;
            tooltip.style.top = `${y + 20}px`; tooltip.hidden = false;
          });
          hit.addEventListener('pointerleave', () => { tooltip.hidden = true; });
          controls.append(hit);
        });
        for (const event of data.events) {
          const mark = chart.append('path').attr('d', D.symbol().type(event.kind === 'failure' ? D.symbolDiamond : D.symbolCircle).size(34)())
            .attr('transform', `translate(${x(event.t)},337)`).attr('fill', event.kind === 'failure' ? 'var(--viz-series-6)' : 'var(--viz-series-5)');
          mark.append('title').text(event.label);
        }
        const eventsButton = document.createElement('button');
        eventsButton.type = 'button'; eventsButton.className = 'phase-button text-small cursor-interaction';
        eventsButton.style.top = '315px'; eventsButton.dataset.phase = '4'; eventsButton.textContent = '失败／恢复';
        eventsButton.addEventListener('click', () => choose(4)); controls.append(eventsButton);
        const hit = document.createElement('button');
        hit.type = 'button'; hit.className = 'lane-hit cursor-interaction'; hit.dataset.lane = 'events';
        hit.style.left = `${left}px`; hit.style.top = '315px'; hit.style.width = `${right - left}px`;
        hit.setAttribute('aria-label', '失败与恢复事件；点击位置或用左右方向键切换');
        hit.addEventListener('click', event => choose(4, null, event.detail ? eventAt(pointTime(event)) : selection.event ?? 0));
        hit.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault(); choose(4, null, Math.max(0, Math.min(data.events.length - 1, (selection.event ?? -1) + (event.key === 'ArrowRight' ? 1 : -1))));
        });
        controls.append(hit);
        showSelection();
        root.dataset.ready = 'true';
        // Axis endpoints anchor inward. Hide optional internal ticks if their
        // measured labels would leave less than four pixels of separation.
        const labels = [...svg.querySelectorAll('text')].filter(node => node.getAttribute('y') === '373');
        for (let index = 1; index < labels.length - 1; index++) {
          const previous = labels[index - 1].getBoundingClientRect();
          const current = labels[index].getBoundingClientRect();
          const next = labels[index + 1].getBoundingClientRect();
          if (current.width && (current.left < previous.right + 4 || current.right + 4 > next.left)) labels[index].remove();
        }
      }
      new ResizeObserver(draw).observe(plot);
      window.addEventListener('openai:set_globals', event => {
        if (!event.detail?.globals?.widgetState) return;
        savedSelection(event.detail.globals.widgetState); showSelection();
      });
      draw();
    })();
  </script>
</section>
