[project]
name = "scenerecall"
version = "0.2.0"
description = "Local-first film evidence library and natural-language scene search"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "keyring>=25,<26",
  "Pillow>=11,<13", "scenedetect>=0.7,<0.8",
  "lancedb>=0.17,<1", "jieba>=0.42.1,<1", "pysubs2>=1.7,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
scenerecall = "scenerecall.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/scenerecall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
