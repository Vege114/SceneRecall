[project]
name = "scenerecall"
version = "0.4.0"
description = "Local-first film evidence library and natural-language scene search"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "keyring>=25,<26",
  "Pillow>=11,<13", "scenedetect>=0.7,<0.8", "av>=18.1,<19",
  "lancedb>=0.17,<1", "jieba>=0.42.1,<1", "pysubs2>=1.7,<2", "psutil>=7,<8",
  "opencc-python-reimplemented>=0.1.7,<1", "pykakasi>=2.3,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
visual-identity = ["dghs-imgutils>=0.19,<0.20"]
audio = ["torch>=2.8,<2.9", "torchaudio>=2.8,<2.9", "torchcodec>=0.7,<0.8", "pyannote.audio>=4,<5", "speechbrain>=1,<2"]
asr = ["faster-whisper>=1,<2"]

[project.scripts]
scenerecall = "scenerecall.main:run"

[tool.uv]
# imgutils 0.19 uses NumPy 1.x; pyannote 4 requires NumPy 2.x. Run the
# imgutils worker from its own Python 3.12 venv via SCENERECALL_VISUAL_PYTHON.
conflicts = [[{ extra = "visual-identity" }, { extra = "audio" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/scenerecall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
